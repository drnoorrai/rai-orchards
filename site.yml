upick:
  eyebrow: U-pick & the farm stand
  heading: How a morning here usually goes
  image_alt: Apples ripening along the trellised rows
  steps:
    - Park in the field and pick up a bag at the stand. We'll tell you which rows
      are ready.
    - Pick at your own pace. Twist, don't tug — the tree keeps next year's bud
      that way.
    - Weigh up at the stand — apples are a flat $1.99 a pound, whatever the
      variety. Cash or tap. Then take a wagon ride and meet the animals before
      you drive home.

