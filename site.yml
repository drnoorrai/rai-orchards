visit:
  eyebrow: Visiting
  heading: Come as you are, leave with a full bag.
  paragraphs:
    - No tickets, no timed entry. Park in the field, grab a bag at the stand, and
      we'll point you at whatever is ripest that morning. Bring the kids, bring
      the dog, bring an appetite.
    - "If it's your first time: give yourself an hour or two. Most people mean to
      pick a bag and end up sitting with the goats."
  hours_label: Hours
  entry_label: Entry
  entry_line: Adults 18+ <strong>$10</strong> · Children 2–17 <strong>$5</strong>
    · Under 2 <strong>free</strong>
  entry_note: Fri–Sun only — no entry fee to visit the farm shop Mon–Thu. Pay at
    the door, cash or card ($1 card fee per transaction).
