story:
  eyebrow: Our story
  headline: We started with sixty trees and a lot of nerve.
  lede: Rai Orchards is a family farm on Wellington 35 in Puslinch. We planted our
    first block in 2021 and we've been learning the ground ever since.
  hero_alt: The Rai Orchards sign at sunset
  paragraph_1: Fruit farming runs in the family. Our people grew apples and pears
    in the Kashmir Valley, on ground that asked for patience — thin soil, hard
    winters, and a habit of doing things by hand because there was no other way.
    When we bought this land, that's the way we knew how to farm.
  portrait_image: img/bibiji.jpg
  portrait_alt: Bibiji shelling beans in the courtyard, Kashmir
  portrait_caption: Bibiji, shelling beans in the courtyard
  portrait_note: Our grandmother, in Kashmir. Everything we know about growing
    food — and about feeding whoever turns up — starts with her.
  paragraph_2: So we planted slowly. Honeycrisp, Gala, Ambrosia and Fuji in the
    apple blocks; Bartlett, Bosc and Dewdrop in the pears; a few rows of peaches
    that ripen early and keep us busy through August. Young trees don't hurry, and
    we've stopped trying to make them.
  paragraph_3: The animals came next, and not entirely on purpose. Mabel the
    donkey, three goats with no respect for fencing, a pair of horses, the mini
    horses, the sheep, and the alpacas who wander the rows like they're
    supervising. They earn their keep by making everyone who visits stay an hour
    longer than they meant to.
  gallery:
    - image: img/alpacas-orchard.jpeg
      alt: Alpacas between the rows
    - image: img/animals-paddock.jpeg
      alt: Feeding time in the paddock
    - image: img/apple-rows.jpg
      alt: The young rows in their first seasons
  vision_eyebrow: What we're growing toward
  vision_heading: More than a place to pick fruit.
  vision_paragraph: We want this to be a gathering place as much as a farm —
    seasons marked by harvest days and open evenings, a market where growers,
    makers and cooks share a table, a kitchen that turns what we pick into
    something worth lingering over, and children learning where food comes from
    with their hands in the soil.
  stats:
    - value: "2021"
      label: First trees in the ground.
    - value: "10"
      label: Varieties of apple, pear and peach.
    - value: "14"
      label: Animals on the welcoming committee.
  cta_heading: Come see it for yourself
  cta_note: Friday to Sunday, 10am to 6pm, with the farm shop open Monday to
    Thursday, 9am to 6pm. Through October 31. 3977 Wellington 35, Puslinch.
  cta_button: Plan your visit
