faq:
  eyebrow: Before you come
  heading: Questions we get<br>at the gate
  items:
    - question: Do I need to book?
      answer: No. Walk in any time Friday to Sunday, 10 to 6. Saturdays and
        Sundays are busiest around 1pm.
    - question: What's open Monday to Thursday?
      answer: The farm shop, 9 to 6 — apples, garlic, eggs and produce, depending
        on what's available. There's no entry fee on those days. U-pick, wagon
        rides, the animals, the kids' play area and the snack shack are Friday to
        Sunday.
    - question: Can we bring the dog?
      answer: Yes, on a leash. Just keep a little distance from the paddock fence.
    - question: When are the animals out?
      answer: Friday to Sunday, 10 to 6, along with the wagon rides, kids' play
        area and snack shack. If you'd like to meet them up close, ask at the front
        desk about meet and greet availability.
    - question: How do we pay?
      answer: Cash or tap at the stand.
    - question: Is it stroller-friendly?
      answer: Mostly. The rows are grass and mown short — a sturdy stroller is fine,
        a light one will bump.

