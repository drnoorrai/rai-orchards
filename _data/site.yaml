faq:
  eyebrow: Before you come
  heading: Questions we get<br>at the gate
  items:
    - question: Is the farm still open?
      answer: Farm visits have closed for the season, but the farm shop is open
        Monday to Saturday, 8am to 6pm, while supplies last. It's closed on Sundays.
    - question: What can I buy at the farm shop?
      answer: Fresh pressed apple cider (1L $5.99, 2L $11.99), farm garlic and fresh
        eggs, while supplies last. Apples and pumpkins are sold out for the year.
    - question: Is there an entry fee?
      answer: No. There's no entry fee to visit the farm shop.
    - question: Can we book the farm privately over the winter?
      answer: Yes, we're happy to hear from you. Email us at info@raiorchards.ca to
        ask about private bookings during the winter months.
    - question: When do farm visits open again?
      answer: Next season. Follow @raiorchards on Instagram or join the harvest note
        below to hear when we reopen.
    - question: How do we pay?
      answer: Cash or card at the farm shop. Card payments have a $1 transaction fee.

