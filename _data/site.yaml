story_teaser:
  eyebrow: Our story
  heading: A Kashmiri family, planting in Puslinch since 2021.
  paragraph: We grow the way our family did back home — slowly, by hand, with more
    patience than a spreadsheet would recommend. The trees are young. So is the
    farm. You're catching us at the good part.
  cta: Read our story
  image_alt: Feeding the goats and horses in the paddock

