faq:
  eyebrow: Before you come
  heading: Questions we get<br>at the gate
  items:
    - question: Do I need to book?
      answer: No. Walk in any time Friday to Sunday, 10 to 6. Saturdays and
        Sundays are busiest around 1pm.
    - question: What's open Monday to Thursday?
      answer: The farm shop, 9 to 6 — fresh pressed cider and pumpkins, depending
        on what's available. There's no entry fee on those days. Wagon rides, the
        animals, the kids' play area and the snack shack are Friday to Sunday.
    - question: Can we still pick apples?
      answer: Not this year — the apples are sold out for the season. We do have
        fresh pressed cider made from our own apples, and plenty of pumpkins.
    - question: Do kids pay to get in?
      answer: Not until October 31. As our Halloween treat, children 2–17 get in
        free. Adults 18+ are $10.
    - question: Can we bring the dog?
      answer: Yes, on a leash. Just keep a little distance from the paddock fence.
    - question: When are the animals out?
      answer: Friday to Sunday, 10 to 6, along with the wagon rides, kids' play
        area and snack shack.
    - question: How do we pay?
      answer: Cash or card at the stand. Card payments have a $1 transaction fee.
    - question: Is it stroller-friendly?
      answer: Mostly. The rows are grass and mown short — a sturdy stroller is fine,
        a light one will bump.

