  submit_error: That didn't go through. Try again in a moment.
vision:
  aria_label: What we're growing toward
  eyebrow: What we're growing toward
  heading_prefix: More than a place to
  heading_emphasis: pick fruit.
  paragraphs:
    - "We imagine Rai Orchards as a gathering place as much as a farm — seasons
      marked by harvest days and open evenings, a market where growers, makers,
      and cooks share a table, and a kitchen that turns what we pick into
      something worth lingering over. We imagine a place where children learn
      where food comes from with their hands in the soil, and where the
      countryside feels close again. "
hiring:
  aria_label: Growing a team
  eyebrow: Hands we're seeking
  line: We're planting more than fruit, and we are looking for a staff and
    volunteers that want to help shape our community.
  roles:
    - Chef & recipe developer
    - Events coordinator
    - Community & wellbeing lead
    - Children's farm educator
    - Analytics lead
    - Apparel & brand designer
    - "Yoga instructor "
  students: And a few places for students who'd rather learn with their hands in
    the soil.
  cta_text: If something here speaks to you, write to us.
  email_subject: Working with Rai Orchards
  reassure: We read every note, and we answer slowly and well.
camp:
  aria_label: Private Events
  eyebrow: "Private Events "
  line: In 2026, we’ll welcome a small number of private events to the orchard,
    from intimate weddings to corporate gatherings. This limited pilot season
    will help us test and thoughtfully refine the infrastructure needed to host
    guests well.
  scarcity: Applications for 2026 are intentionally limited. Full private event
    rentals are planned for 2027.
  cta_text: Tell us about your event.
  email_subject: Private event enquiry
